<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Valle — Robo de posesión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue-dark: #0a1f44;
    --blue-mid: #1a3a7a;
    --blue-light: #3a6bc8;
    --blue-pale: #dce8fb;
    --yellow: #f5c800;
    --yellow-dark: #c9a200;
    --yellow-pale: #fdf6cc;
    --surface: #f7f9fc;
    --surface-2: #ffffff;
    --border: rgba(10,31,68,0.13);
    --text: #0a1f44;
    --text-muted: #3a5080;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(10,31,68,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header { background: var(--blue-dark); color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; border-bottom: 3px solid var(--yellow); }
  header .logo { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
  header .logo span { color: var(--yellow); }
  header .subtitle { font-size: 0.8rem; opacity: 0.7; }
  header .spacer { flex: 1; }
  header .game-info { text-align: right; font-size: 0.85rem; }
  header .game-info strong { display: block; font-size: 1rem; }

  /* SCREENS */
  .screen { display: none; padding: 1rem; max-width: 700px; margin: 0 auto; }
  .screen.active { display: block; }

  /* SETUP SCREEN */
  .setup-card { background: var(--surface-2); border-radius: 16px; border: 1px solid var(--border); padding: 2rem; box-shadow: var(--shadow); }
  .setup-card h2 { font-size: 1.2rem; font-weight: 600; color: var(--blue-dark); margin-bottom: 1.5rem; }
  .field { margin-bottom: 1.25rem; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input[type="text"] { width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 1rem; color: var(--text); background: var(--surface); transition: border-color .2s; }
  .field input[type="text"]:focus { outline: none; border-color: var(--blue-mid); }
  .toggle-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .toggle-btn { flex: 1; min-width: 120px; padding: 0.6rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text-muted); font-size: 0.9rem; cursor: pointer; transition: all .2s; text-align: center; }
  .toggle-btn.active { background: var(--blue-dark); border-color: var(--blue-dark); color: var(--yellow); font-weight: 600; }
  .toggle-btn:hover:not(.active) { border-color: var(--blue-mid); color: var(--blue-mid); }
  .btn-primary { background: var(--blue-dark); color: var(--yellow); border: none; padding: 0.8rem 2rem; border-radius: var(--radius); font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1rem; transition: background .2s; }
  .btn-primary:hover { background: var(--blue-mid); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  /* MATCH SCREEN */
  #screen-match {
    max-width: 820px;
    flex-direction: column;
    height: calc(100dvh - 70px);
    padding: 0.6rem;
    box-sizing: border-box;
    overflow: hidden;
  }
  #screen-match.active { display: flex !important; }
  .court-wrapper { flex: 1; min-height: 0; }
  .match-controls { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; flex-shrink: 0; }

  .match-controls .spacer { flex: 1; }
  .btn-half { background: var(--yellow); color: var(--blue-dark); border: none; padding: 0.55rem 1.2rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-half:hover { background: var(--yellow-dark); }
  .btn-end { background: var(--blue-dark); color: #fff; border: none; padding: 0.55rem 1.2rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn-end:hover { background: var(--blue-mid); }

  /* COURT */
  .court-wrapper { position: relative; width: 100%; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); border: 2px solid var(--blue-mid); }
  .court-svg { display: block; width: 100%; height: 100%; object-fit: contain; background: #c8a96e; }

  /* QUADRANT OVERLAY */
  .quadrant-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; }
  .quadrant-overlay.lateral { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
  .quadrant-overlay.fondo { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  .quadrant { border: 1px solid rgba(255,255,255,0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgba(0,0,0,0.04); transition: background .15s; }
  .quadrant:hover { background: rgba(255,255,255,0.15); }
  .quadrant .count { font-size: clamp(0.9rem,3vw,1.5rem); font-weight: 800; color: var(--blue-dark); background: rgba(255,255,255,0.88); border-radius: 50%; width: clamp(1.6rem,5vw,2.2rem); height: clamp(1.6rem,5vw,2.2rem); display: flex; align-items: center; justify-content: center; line-height: 1; }
  .quadrant .count.has-steals { background: var(--yellow); color: var(--blue-dark); }
  .quadrant .q-btns { display: flex; gap: 3px; }
  .q-btn { width: clamp(1.4rem,4.5vw,1.9rem); height: clamp(1.4rem,4.5vw,1.9rem); border-radius: 50%; border: none; font-size: clamp(0.85rem,3vw,1.1rem); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s; line-height: 1; }
  .q-btn:active { transform: scale(0.92); }
  .q-btn.plus { background: var(--blue-dark); color: var(--yellow); }
  .q-btn.plus:hover { background: var(--blue-mid); }
  .q-btn.minus { background: rgba(255,255,255,0.7); color: var(--text-muted); border: 1.5px solid var(--border); }
  .q-btn.minus:hover { background: #fff; }
  .q-label { font-size: 0.62rem; color: rgba(10,31,68,0.65); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }

  /* TOTALS */
  .totals-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; flex-shrink: 0; }
  .total-card { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.35rem 0.5rem; text-align: center; }
  .total-card .t-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .total-card .t-value { font-size: 1.3rem; font-weight: 800; color: var(--blue-dark); line-height: 1.1; }
  .total-card.highlight .t-value { color: var(--blue-light); }

  /* RESULTS SCREEN */
  .results-section { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
  .results-section h3 { font-size: 1rem; font-weight: 700; color: var(--blue-dark); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 3px solid var(--yellow); }
  .court-mini-wrapper { position: relative; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--blue-mid); margin-bottom: 0.5rem; }
  .heat-cell { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  .btn-export { flex: 1; padding: 0.7rem 1rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text); transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
  .btn-export:hover { background: var(--blue-pale); border-color: var(--blue-mid); color: var(--blue-dark); }
  .export-row { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
  .btn-new-match { background: var(--blue-dark); color: var(--yellow); border: none; padding: 0.75rem 2rem; border-radius: var(--radius); font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 0.5rem; }
  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.5rem; margin-top: 0.75rem; }
  .stat-item { background: var(--surface); border-radius: 8px; padding: 0.6rem; text-align: center; }
  .stat-item .sv { font-size: 1.4rem; font-weight: 800; color: var(--blue-dark); }
  .stat-item .sl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .half-bar { display: flex; gap: 1rem; }
  .half-col { flex: 1; }
  .half-col h4 { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; }
  .q-row { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .q-row:last-child { border-bottom: none; }
  .q-name { color: var(--text-muted); }
  .q-val { font-weight: 700; color: var(--blue-dark); }
  .q-val.hot { color: var(--blue-light); }

  /* ARROW LEGEND */
  .arrow-legend { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.3rem; padding: 0.25rem 0.6rem; background: var(--blue-pale); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.75rem; color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
  .legend-arrow { font-size: 1.1rem; color: var(--blue-dark); opacity: 0.5; }

  .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .confirm-box { background: #fff; border-radius: 14px; padding: 2rem; max-width: 320px; width: 90%; text-align: center; }
  .confirm-box h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--blue-dark); }
  .confirm-box p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem; }
  .confirm-btns { display: flex; gap: 0.75rem; }
  .confirm-btns button { flex: 1; padding: 0.65rem; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 0.9rem; border: 1.5px solid var(--border); }
  .confirm-btns .yes { background: var(--blue-dark); color: var(--yellow); border-color: var(--blue-dark); }
  .confirm-btns .no { background: var(--surface); color: var(--text); }
  .match-controls .period-badge { background: var(--yellow); color: var(--blue-dark); border-radius: 20px; padding: 0.35rem 1rem; font-size: 0.85rem; font-weight: 700; }
</style>
</head>

<!-- MATCH -->
<div id="screen-match" class="screen">
  <div class="match-controls">
    <div class="period-badge" id="period-badge">1ª parte</div>
    <div class="spacer"></div>
    <button class="btn-half" id="btn-half" onclick="confirmHalfTime()">Descanso →</button>
    <button class="btn-end" onclick="confirmEndMatch()">Finalizar</button>
  </div>

  <div class="court-wrapper" id="court-wrapper">
    <svg class="court-svg" id="court-svg" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"></svg>

  </div>
  <div class="arrow-legend" id="arrow-legend">
    <span class="legend-arrow" id="legend-arrow">→</span>
    <span id="legend-text">Dirección de ataque del rival</span>
  </div>
  <div class="totals-row">
    <div class="total-card">
      <div class="t-label">1ª parte</div>
      <div class="t-value" id="total-h1">0</div>
    </div>
    <div class="total-card highlight">
      <div class="t-label">Total</div>
      <div class="t-value" id="total-all">0</div>
    </div>
    <div class="total-card">
      <div class="t-label">2ª parte</div>
      <div class="t-value" id="total-h2">0</div>
    </div>
  </div>
</div>

<!-- RESULTS -->

  </div>

    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const STATE_KEY = 'elvalle_match_v3';
let state = null;

function defaultState() {
  return {
    rival: '',
    orient: '',
    direction: '',      // El Valle attack direction (1st half)
    rivalDirection: '', // Rival attack direction (1st half)
    period: 1,
    // 8 quadrants per period. Q0-Q7 in visual order (top-left to bottom-right, row by row)
    // For 'lateral': 4 cols x 2 rows => Q[row][col], stored flat row-major
    // For 'fondo':   2 cols x 4 rows => same
    steals: { 1: Array(8).fill(0), 2: Array(8).fill(0) },
    finished: false,
    date: new Date().toLocaleDateString('es-ES')
  };
}

function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
function loadState() {
  try {
    const s = localStorage.getItem(STATE_KEY);
    if (s) {
      state = JSON.parse(s);
      // Ensure steals are proper arrays after JSON parse
      state.steals[1] = Array.from(state.steals[1] || Array(8).fill(0));
      state.steals[2] = Array.from(state.steals[2] || Array(8).fill(0));
    }
  } catch(e) { state = null; }
}

// ─── SETUP ───────────────────────────────────────────────────────────────────
const DIRECTIONS = {
  fondo:   [{ val:'arriba-abajo', label:'↓ De arriba a abajo' }, { val:'abajo-arriba', label:'↑ De abajo a arriba' }],
  lateral: [{ val:'izq-der',     label:'→ De izquierda a derecha' }, { val:'der-izq',  label:'← De derecha a izquierda' }]
};

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btn-orient-fondo').addEventListener('click', function() {
    document.getElementById('btn-orient-fondo').classList.add('active');
    document.getElementById('btn-orient-lateral').classList.remove('active');
    updateDirButtons('fondo');
    validateSetup();
  });
  document.getElementById('btn-orient-lateral').addEventListener('click', function() {
    document.getElementById('btn-orient-lateral').classList.add('active');
    document.getElementById('btn-orient-fondo').classList.remove('active');
    updateDirButtons('lateral');
    validateSetup();
  });
  document.getElementById('input-rival').addEventListener('input', validateSetup);

  // Init app
  loadState();
  if (state && !state.finished && state.rival) {
    goToMatch();
  } else if (state && state.finished) {
    showResults();
  }
});

function updateDirButtons(orient) {
  const suffix = orient === 'fondo' ? 'vista desde fondo' : 'vista lateral';

  // Rival direction buttons
  const rivalContainer = document.getElementById('rival-dir-buttons');
  rivalContainer.innerHTML = '';
  DIRECTIONS[orient].forEach(d => {
    const b = document.createElement('button');
    b.className = 'toggle-btn';
    b.dataset.field = 'rival-dir';
    b.dataset.val = d.val;
    b.textContent = d.label;
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-field="rival-dir"]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      validateSetup();
    });
    rivalContainer.appendChild(b);
  });
  document.getElementById('rival-dir-label').textContent =
    `Dirección de ataque del rival (1ª parte) — ${suffix}`;
  document.getElementById('field-rival-dir').style.display = '';
  // Reset rival selection when orientation changes
  document.querySelectorAll('#rival-dir-buttons .toggle-btn').forEach(b => b.classList.remove('active'));
}

function validateSetup() {
  const rival = document.getElementById('input-rival').value.trim();
  const orientActive = document.getElementById('btn-orient-fondo').classList.contains('active') ? 'fondo'
    : document.getElementById('btn-orient-lateral').classList.contains('active') ? 'lateral' : null;
  const rivalDir = document.querySelector('#rival-dir-buttons .toggle-btn.active')?.dataset.val;
  document.getElementById('btn-start').disabled = !(rival && orientActive && rivalDir);
}

function startMatch() {
  state = defaultState();
  state.rival = document.getElementById('input-rival').value.trim();
  state.orient = document.getElementById('btn-orient-fondo').classList.contains('active') ? 'fondo' : 'lateral';
  state.rivalDirection = document.querySelector('#rival-dir-buttons .toggle-btn.active').dataset.val;
  state.direction = flipDirection(state.rivalDirection); // Valle attacks opposite to rival
  saveState();
  goToMatch();
}

// ─── MATCH SCREEN ────────────────────────────────────────────────────────────
function goToMatch() {
  showScreen('match');
  document.getElementById('header-info').style.display = '';
  document.getElementById('header-rival').textContent = `vs ${state.rival}`;
  document.getElementById('header-orient').textContent =
    state.orient === 'fondo' ? 'Vista desde fondo' : 'Vista lateral';

  renderCourt();
  renderQuadrants();
  updateLegend();
  updateTotals();
  document.getElementById('period-badge').textContent =
    state.period === 1 ? '1ª parte' : '2ª parte';
  const btnHalf = document.getElementById('btn-half');
  if (state.period === 2) {
    btnHalf.textContent = 'Finalizar →';
    btnHalf.onclick = confirmEndMatch;
  } else {
    btnHalf.textContent = 'Descanso →';
    btnHalf.onclick = confirmHalfTime;
  }
}

// ─── QUADRANTS ───────────────────────────────────────────────────────────────
// Layout: lateral → 4cols × 2rows; fondo → 2cols × 4rows
// Index mapping: row-major, top-left = 0

function getQuadrantLabels() {
  const isLateral = state.orient === 'lateral';
  const dir = getCurrentAttackDirection();
  // We'll label quadrants based on current attack direction (flipped in 2nd half)
  if (isLateral) {
    // cols: 1=attack side left half, 2=attack side right half, mirrored by direction
    const rows = ['Superior', 'Inferior'];
    const cols = dir === 'izq-der'
      ? ['Z. def. lejos', 'Z. def. cerca', 'Z. at. cerca', 'Z. at. lejos']
      : ['Z. at. lejos', 'Z. at. cerca', 'Z. def. cerca', 'Z. def. lejos'];
    const labels = [];
    for (let r = 0; r < 2; r++)
      for (let c = 0; c < 4; c++)
        labels.push(`${cols[c]}\n${rows[r]}`);
    return labels;
  } else {
    const cols = ['Izquierda', 'Derecha'];
    const rows = dir === 'arriba-abajo'
      ? ['Z. def. lejos', 'Z. def. cerca', 'Z. at. cerca', 'Z. at. lejos']
      : ['Z. at. lejos', 'Z. at. cerca', 'Z. def. cerca', 'Z. def. lejos'];
    const labels = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 2; c++)
        labels.push(`${rows[r]}\n${cols[c]}`);
    return labels;
  }
}

function renderQuadrants() {
  const overlay = document.getElementById('quadrant-overlay');
  overlay.innerHTML = '';
  const labels = getQuadrantLabels();
  const steals = state.steals[state.period];
  steals.forEach((count, i) => {
    const q = document.createElement('div');
    q.className = 'quadrant';
    q.dataset.idx = i;

    const lbl = document.createElement('div'); // no label shown

    const cnt = document.createElement('div');
    cnt.className = 'count' + (count > 0 ? ' has-steals' : '');
    cnt.id = `q-count-${i}`;
    cnt.textContent = count;

    const btns = document.createElement('div');
    btns.className = 'q-btns';

    const minus = document.createElement('button');
    minus.className = 'q-btn minus';
    minus.textContent = '−';
    minus.setAttribute('aria-label', `Quitar robo cuadrante ${i+1}`);
    minus.addEventListener('click', (e) => { e.stopPropagation(); changeSteal(i, -1); });

    const plus = document.createElement('button');
    plus.className = 'q-btn plus';
    plus.textContent = '+';
    plus.setAttribute('aria-label', `Añadir robo cuadrante ${i+1}`);
    plus.addEventListener('click', (e) => { e.stopPropagation(); changeSteal(i, 1); });

    btns.appendChild(minus);
    btns.appendChild(plus);
    q.appendChild(lbl);
    q.appendChild(cnt);
    q.appendChild(btns);
    overlay.appendChild(q);
  });
}

function changeSteal(idx, delta) {
  const cur = state.steals[state.period][idx];
  if (cur + delta < 0) return;
  state.steals[state.period][idx] += delta;
  saveState();
  const cnt = document.getElementById(`q-count-${idx}`);
  if (cnt) {
    cnt.textContent = state.steals[state.period][idx];
    cnt.className = 'count' + (state.steals[state.period][idx] > 0 ? ' has-steals' : '');
  }
  updateTotals();
}

function updateTotals() {
  const h1 = state.steals[1].reduce((a,b)=>a+b,0);
  const h2 = state.steals[2].reduce((a,b)=>a+b,0);
  document.getElementById('total-h1').textContent = h1;
  document.getElementById('total-h2').textContent = h2;
  document.getElementById('total-all').textContent = h1 + h2;
}

// ─── DIRECTION INDICATOR ─────────────────────────────────────────────────────
function updateDirection() {
  // Direction is now shown via arrow on the court SVG — nothing to update here
}

function getCurrentAttackDirection() {
  // In 2nd half, direction is flipped (mirror across center)
  if (state.period === 1) return state.direction;
  return flipDirection(state.direction);
}

function flipDirection(dir) {
  const map = { 'izq-der':'der-izq', 'der-izq':'izq-der', 'arriba-abajo':'abajo-arriba', 'abajo-arriba':'arriba-abajo' };
  return map[dir] || dir;
}

function getRivalAttackDirection() {
  const base = state.rivalDirection || flipDirection(state.direction);
  return state.period === 1 ? base : flipDirection(base);
}

function updateLegend() {
  const dir = getRivalAttackDirection();
  const arrows = { 'arriba-abajo':'↓', 'abajo-arriba':'↑', 'izq-der':'→', 'der-izq':'←' };
  const texts = {
    'arriba-abajo': 'El rival ataca hacia abajo',
    'abajo-arriba': 'El rival ataca hacia arriba',
    'izq-der': 'El rival ataca hacia la derecha',
    'der-izq': 'El rival ataca hacia la izquierda'
  };
  const arrowEl = document.getElementById('legend-arrow');
  const textEl = document.getElementById('legend-text');
  if (arrowEl) arrowEl.textContent = arrows[dir] || '→';
  if (textEl) textEl.textContent = texts[dir] || 'Dirección de ataque del rival';
}

function confirmHalfTime() {
  if (state.period === 2) { confirmEndMatch(); return; }
  showConfirm(
    '¿Descanso?',
    'Se registrará el final de la 1ª parte. Los datos se mantendrán y el ataque cambiará de sentido.',

}

  saveState();
  document.getElementById('period-badge').textContent = '2ª parte';
  const btnHalf = document.getElementById('btn-half');

// ─── COMBINED STEALS (mirror H2 onto H1 quadrants) ──────────────────────────
function getCombinedSteals() {
  const isLateral = state.orient === 'lateral';
  const cols = isLateral ? 4 : 2;
  const rows = isLateral ? 2 : 4;
  const combined = Array(8).fill(0);
  // H1 maps 1:1
  state.steals[1].forEach((v, i) => { combined[i] += v; });
  // H2: mirror axis is horizontal (lateral) or vertical (fondo)
  state.steals[2].forEach((v, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    let mirrorIdx;
    if (isLateral) {
      // flip column: col → (cols-1-col)
      mirrorIdx = row * cols + (cols - 1 - col);
    } else {
      // flip row: row → (rows-1-row)
      mirrorIdx = (rows - 1 - row) * cols + col;
    }
    combined[mirrorIdx] += v;
  });
  return combined;
}

// ─── DRAW COURT ON CANVAS (pure 2D, no SVG, iOS safe) ───────────────────────
function drawCourtOnCanvas(ctx, steals, rivalDir, x, y, W, H) {
  const isLateral = state.orient === 'lateral';
  const cols = isLateral ? 4 : 2;
  const rows = isLateral ? 2 : 4;
  const cw = W / cols, ch = H / rows;

  // Court background
  ctx.fillStyle = '#c8a96e';
  ctx.fillRect(x, y, W, H);

  // Paint lines helper
  const s = (sx, sy, ex, ey, color='#fff', lw=2) => {
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x+sx*(W/100), y+sy*(H/100));
    ctx.lineTo(x+ex*(W/100), y+ey*(H/100)); ctx.stroke(); ctx.restore();
  };

  if (isLateral) {
    // Border
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.strokeRect(x+2, y+2, W-4, H-4);
    // Half line
    s(50,0,50,100,'#fff',2);
    // Center circle
    ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x+W/2, y+H/2, H*0.14, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    // Keys (left & right)
    ctx.strokeStyle='rgba(180,120,60,0.8)'; ctx.lineWidth=2;
    ctx.strokeRect(x+2, y+H*0.3, W*0.195, H*0.4);
    ctx.strokeRect(x+W-W*0.195-2, y+H*0.3, W*0.195, H*0.4);
    // Baskets
    ctx.strokeStyle='#f5c800'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x+W*0.073, y+H/2, H*0.035, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+W*0.927, y+H/2, H*0.035, 0, Math.PI*2); ctx.stroke();
    // Grid lines
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
    [25,75].forEach(p => { ctx.beginPath(); ctx.moveTo(x+W*p/100,y); ctx.lineTo(x+W*p/100,y+H); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(x,y+H/2); ctx.lineTo(x+W,y+H/2); ctx.stroke();
  } else {
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.strokeRect(x+2, y+2, W-4, H-4);
    s(0,50,100,50,'#fff',2);
    ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x+W/2, y+H/2, W*0.14, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='rgba(180,120,60,0.8)'; ctx.lineWidth=2;
    ctx.strokeRect(x+W*0.3, y+2, W*0.4, H*0.195);
    ctx.strokeRect(x+W*0.3, y+H-H*0.195-2, W*0.4, H*0.195);
    ctx.strokeStyle='#f5c800'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x+W/2, y+H*0.073, W*0.035, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+W/2, y+H*0.927, W*0.035, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
    [25,75].forEach(p => { ctx.beginPath(); ctx.moveTo(x,y+H*p/100); ctx.lineTo(x+W,y+H*p/100); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(x+W/2,y); ctx.lineTo(x+W/2,y+H); ctx.stroke();
  }

  // Heat cells
  const maxQ = Math.max(...steals, 1);
  steals.forEach((v, i) => {
    if (v === 0) return;
    const col = i % cols, row = Math.floor(i / cols);
    const rx = x + col*cw, ry = y + row*ch;
    const intensity = v / maxQ;
    ctx.fillStyle = `rgba(26,64,160,${(0.15 + intensity*0.6).toFixed(2)})`;
    ctx.fillRect(rx+1, ry+1, cw-2, ch-2);
    ctx.fillStyle = intensity > 0.45 ? '#ffffff' : '#0a1f44';
    ctx.font = `bold ${Math.round(Math.min(cw,ch)*0.38)}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(v, rx + cw/2, ry + ch/2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  });

  // Arrow
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#0a1f44';
  ctx.strokeStyle = '#0a1f44';
  ctx.lineWidth = isLateral ? H*0.06 : W*0.06;
  ctx.lineCap = 'round';
  if (isLateral) {
    if (rivalDir === 'izq-der') {
      ctx.beginPath(); ctx.moveTo(x+W*0.15,y+H/2); ctx.lineTo(x+W*0.76,y+H/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+W*0.76,y+H*0.35); ctx.lineTo(x+W*0.9,y+H/2); ctx.lineTo(x+W*0.76,y+H*0.65); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(x+W*0.85,y+H/2); ctx.lineTo(x+W*0.24,y+H/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+W*0.24,y+H*0.35); ctx.lineTo(x+W*0.1,y+H/2); ctx.lineTo(x+W*0.24,y+H*0.65); ctx.fill();
    }
  } else {
    if (rivalDir === 'arriba-abajo') {
      ctx.beginPath(); ctx.moveTo(x+W/2,y+H*0.15); ctx.lineTo(x+W/2,y+H*0.76); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+W*0.35,y+H*0.76); ctx.lineTo(x+W/2,y+H*0.9); ctx.lineTo(x+W*0.65,y+H*0.76); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(x+W/2,y+H*0.85); ctx.lineTo(x+W/2,y+H*0.24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+W*0.35,y+H*0.24); ctx.lineTo(x+W/2,y+H*0.1); ctx.lineTo(x+W*0.65,y+H*0.24); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // "ATAQUE RIVAL" label
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#0a1f44';
  ctx.font = `bold ${Math.round(Math.min(W,H)*0.06)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (isLateral) {
    ctx.fillText('ATAQUE RIVAL', x+W/2, y+H*0.28);
  } else {
    ctx.save();
    ctx.translate(x+W/2, y+H/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('ATAQUE RIVAL', 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  // Border
  ctx.strokeStyle = '#1a40a0'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, W, H);
}

// ─── SHARE JPG VIA WHATSAPP ──────────────────────────────────────────────────
async function sharePDFWhatsApp() {
  const btn = document.querySelector('.btn-export');
  const origText = btn.textContent;
  btn.textContent = 'Generando…';
  btn.disabled = true;

  try {
    const h1 = state.steals[1].reduce((a,b)=>a+b,0);
    const h2 = state.steals[2].reduce((a,b)=>a+b,0);
    const total = h1 + h2;
    const combined = getCombinedSteals();
    const isLateral = state.orient === 'lateral';

    // Court pixel size in infographic
    const cW = isLateral ? 500 : 250;
    const cH = isLateral ? 250 : 500;

    // Infographic canvas: 1080px wide (portrait, WhatsApp friendly)
    const IW = 1080, pad = 36;
    const headerH = 110;
    const statsH = 90;
    const labelH = 36;
    const halfRowH = labelH + cH + pad;
    const combRowH = labelH + cH + pad;
    const footerH = 40;
    const IH = headerH + statsH + halfRowH + combRowH + footerH + pad;

    const canvas = document.createElement('canvas');
    canvas.width = IW; canvas.height = IH;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#f0f4f8';
    ctx.fillRect(0, 0, IW, IH);

    // Header
    ctx.fillStyle = '#0a1f44';
    ctx.fillRect(0, 0, IW, headerH - 8);
    ctx.fillStyle = '#f5c800';
    ctx.fillRect(0, headerH - 8, IW, 8);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px Arial';
    ctx.fillText('CDE El Valle — Robo de posesión', pad, 48);
    ctx.font = '22px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(`vs ${state.rival}  ·  ${state.date}  ·  Vista: ${state.orient === 'fondo' ? 'fondo' : 'lateral'}`, pad, 80);

    // Stats row — 4 cards below header
    const statsData = [
      { v: total,                      l: 'Total robos' },
      { v: h1,                         l: '1ª parte' },
      { v: h2,                         l: '2ª parte' },
      { v: total > 0 ? (total/2).toFixed(1) : '0', l: 'Media/parte' },
    ];
    const sCardW = Math.floor((IW - pad*2 - 12*3) / 4);
    statsData.forEach(({ v, l }, i) => {
      const sx2 = pad + i * (sCardW + 12);
      const sy2 = headerH + 12;
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, sx2, sy2, sCardW, statsH - 16, 10); ctx.fill();
      ctx.strokeStyle = '#dce8fb'; ctx.lineWidth = 1.5;
      roundRect(ctx, sx2, sy2, sCardW, statsH - 16, 10); ctx.stroke();
      ctx.fillStyle = '#0a1f44';
      ctx.font = `bold ${Math.round(sCardW * 0.22)}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(v, sx2 + sCardW/2, sy2 + 44);
      ctx.font = `${Math.round(sCardW * 0.10)}px Arial`;
      ctx.fillStyle = '#3a5080';
      ctx.fillText(l.toUpperCase(), sx2 + sCardW/2, sy2 + 63);
      ctx.textAlign = 'left';
    });

    // Half courts side by side
    const halfY = headerH + statsH + pad/2;
    const gap = IW - 2*cW - 2*pad;
    const hx1 = pad, hx2 = pad + cW + gap;

    ctx.font = 'bold 24px Arial';
    ctx.fillStyle = '#3a5080';
    ctx.textAlign = 'center';
    ctx.fillText('1ª PARTE', hx1 + cW/2, halfY + labelH - 6);
    ctx.fillText('2ª PARTE', hx2 + cW/2, halfY + labelH - 6);
    ctx.textAlign = 'left';

    const rd1 = state.rivalDirection;
    const rd2 = flipDirection(state.rivalDirection);
    drawCourtOnCanvas(ctx, state.steals[1], rd1, hx1, halfY + labelH, cW, cH);
    drawCourtOnCanvas(ctx, state.steals[2], rd2, hx2, halfY + labelH, cW, cH);

    // Combined court centered
    const combY = halfY + halfRowH;
    const combCW = isLateral ? Math.min(IW - 2*pad, 700) : 320;
    const combCH = isLateral ? Math.round(combCW/2) : Math.round(combCW*2);
    const combX = Math.round((IW - combCW) / 2);

    ctx.font = 'bold 24px Arial';
    ctx.fillStyle = '#0a1f44';
    ctx.textAlign = 'center';
    ctx.fillText('PARTIDO COMPLETO', IW/2, combY + labelH - 6);
    ctx.textAlign = 'left';

    drawCourtOnCanvas(ctx, combined, rd1, combX, combY + labelH, combCW, combCH);

    // Footer
    ctx.font = '18px Arial';
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.fillText('Club Deportivo El Valle · Robo de posesión', IW/2, IH - 12);
    ctx.textAlign = 'left';

    // Open image in new browser tab
    const jpgDataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const w = window.open('', '_blank');
    w.document.write(`<html><head><title>El Valle vs ${state.rival}</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:flex-start;}img{max-width:100%;}</style></head><body><img src="${jpgDataUrl}"/></body></html>`);
    w.document.close();

  } catch(e) {
    alert('Error al generar la imagen: ' + e.message);
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ─── CONFIRM MODAL ───────────────────────────────────────────────────────────
let confirmCallback = null;
function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCallback = cb;
  document.getElementById('confirm-overlay').style.display = 'flex';
  document.getElementById('confirm-yes').onclick = () => { closeConfirm(); if(confirmCallback) confirmCallback(); };
}
function closeConfirm() { document.getElementById('confirm-overlay').style.display = 'none'; }

// ─── NEW MATCH ───────────────────────────────────────────────────────────────
function newMatch() {
  localStorage.removeItem(STATE_KEY);
  state = null;
  document.getElementById('header-info').style.display = 'none';
  document.getElementById('input-rival').value = '';
  document.getElementById('btn-orient-fondo').classList.remove('active');
  document.getElementById('btn-orient-lateral').classList.remove('active');
  document.getElementById('rival-dir-buttons').innerHTML = '';
  document.getElementById('field-rival-dir').style.display = 'none';
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-half').style.display = '';
  showScreen('setup');
}

// ─── SCREEN MANAGER ──────────────────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
